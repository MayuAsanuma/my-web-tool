<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>My Web Tool</title>
</head>

<body>
  <h1>はじめてのWebツール</h1>

  <input id="word" type="text" placeholder="文字を入力">

  <button onclick="countText()">
    文字数を数える
  </button>

  <p id="result"></p>

  <button onclick="clearText()">
  クリア
</button>

  <script>
    function countText() {
      const text = document.getElementById("word").value;
      document.getElementById("result").textContent =
        "文字数：" + text.length;
    }

    function clearText(){
        document.getElementById("word").value="";
        document.getElementById("result").textContent="";
    }
  </script>
</body>
</html>
